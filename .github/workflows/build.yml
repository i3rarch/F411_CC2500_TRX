name: Build STM32 Project

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install ARM toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi make
        
    - name: Verify toolchain
      run: |
        arm-none-eabi-gcc --version
        make --version
        
    - name: Build project
      run: |
        make clean
        make all
        
    - name: Check build artifacts
      run: |
        ls -la build/
        file build/F411_CC2500_TRX.elf
        arm-none-eabi-size build/F411_CC2500_TRX.elf
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-build
        path: |
          F411_CC2500_TRX/build/F411_CC2500_TRX.elf
          F411_CC2500_TRX/build/F411_CC2500_TRX.hex
          F411_CC2500_TRX/build/F411_CC2500_TRX.bin
          F411_CC2500_TRX/build/F411_CC2500_TRX.map
        retention-days: 30