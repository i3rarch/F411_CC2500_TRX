name: Build STM32 Project

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mcu: [f411, f401]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ARM toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi make

    - name: Verify toolchain
      run: |
        arm-none-eabi-gcc --version
        make --version

    - name: Build project for ${{ matrix.mcu }}
      run: |
        make clean
        make all MCU_TARGET=${{ matrix.mcu }}

    - name: Check build artifacts for ${{ matrix.mcu }}
      run: |
        ls -la build/

    - name: Upload build artifacts for ${{ matrix.mcu }}
      uses: actions/upload-artifact@v4
      with:
        name: firmware-build-${{ matrix.mcu }}
        path: build/
        retention-days: 30